<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>PokeTokenLite Widget</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  body {
    width: 108px; height: 134px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: sans-serif; user-select: none;
  }
  #sprite {
    width: 80px; height: 80px; image-rendering: pixelated; cursor: pointer;
    border-radius: 50%;
    box-shadow: 0 0 0 3px var(--tier-color, transparent);
    background: rgba(0, 0, 0, 0.15);
  }
  .bar-bg { width: 90px; height: 6px; background: rgba(0, 0, 0, 0.4); border-radius: 4px; overflow: hidden; margin-top: 6px; }
  .bar-fill { height: 100%; background: #4caf50; width: 0%; transition: width .3s; }
</style>
</head>
<body>
  <img id="sprite" src="" alt="" title="" />
  <div class="bar-bg"><div class="bar-fill" id="bar"></div></div>

  <script>
    const TIER_COLORS = { common: "#6c757d", uncommon: "#2f9e44", epic: "#4c6ef5", legendary: "#f59f00", mythical: "#e64980" };
    const sprite = document.getElementById("sprite");
    const bar = document.getElementById("bar");

    function render(s) {
      if (s.sprite) sprite.src = s.sprite;
      sprite.style.setProperty("--tier-color", s.tier && TIER_COLORS[s.tier] ? TIER_COLORS[s.tier] : "transparent");

      const needed = s.needed;
      const pct = needed ? Math.min(100, Math.round((s.progress / needed) * 100)) : 100;
      bar.style.width = pct + "%";

      sprite.title =
        s.state === "egg"
          ? `🥚 알 · ${s.progress.toLocaleString()} / ${needed.toLocaleString()} 토큰 (${pct}%)`
          : `${s.label}${s.isShiny ? " ✨" : ""} · ${s.progress.toLocaleString()}${needed != null ? " / " + needed.toLocaleString() : ""} 토큰 (${pct}%)`;
    }

    function poll() {
      window.api.getStatus().then(render);
    }
    poll();
    setInterval(poll, 20_000); // 아래 onStatusUpdate가 즉시 갱신을 대부분 커버하니 이건 안전망 정도
    window.api.onStatusUpdate(render); // 부화/진화/졸업/다시 키우기 등으로 바뀌는 즉시 반영

    // 드래그를 직접 구현(−webkit-app-region: drag는 Windows에서 더블클릭이랑
    // 같이 쓰면 더블클릭이 씹히는 문제가 있어서 — 실제로 겪음). mousedown 시점
    // 창 위치를 받아두고, mousemove로 얼마나 움직였는지 계산해서 창을 옮긴다.
    // 실제로 움직인 적이 있으면(didDrag) 그 클릭/더블클릭은 무시해서 드래그
    // 끝에 팝업이 실수로 열리지 않게 한다.
    let dragOrigin = null;
    let didDrag = false;

    document.addEventListener("mousedown", async (e) => {
      if (e.button !== 0) return;
      didDrag = false;
      const [winX, winY] = await window.api.getWidgetPosition();
      dragOrigin = { mouseX: e.screenX, mouseY: e.screenY, winX, winY };
    });
    document.addEventListener("mousemove", (e) => {
      if (!dragOrigin) return;
      const dx = e.screenX - dragOrigin.mouseX;
      const dy = e.screenY - dragOrigin.mouseY;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) didDrag = true;
      if (didDrag) window.api.moveWidgetTo(dragOrigin.winX + dx, dragOrigin.winY + dy);
    });
    document.addEventListener("mouseup", () => {
      dragOrigin = null;
    });

    // 더블클릭하면 메인 팝업 열고 위젯은 닫힘(둘 다 떠있지 않게).
    sprite.addEventListener("dblclick", () => {
      if (didDrag) return; // 방금 드래그였으면 클릭으로 취급 안 함
      window.api.openPopup();
    });
    document.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      window.api.widgetContextMenu();
    });
  </script>
</body>
</html>
