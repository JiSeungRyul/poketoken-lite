<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>PokeTokenLite Widget</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  body {
    width: 108px; height: 134px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: sans-serif; user-select: none;
    -webkit-user-drag: none;
  }
  #sprite {
    width: 80px; height: 80px; image-rendering: pixelated; cursor: pointer;
    border-radius: 50%;
    box-shadow: 0 0 0 3px var(--tier-color, transparent);
    background: rgba(0, 0, 0, 0.15);
    -webkit-user-drag: none; /* 이미지 기본 드래그(브라우저 밖으로 끌어다 놓으면 파일 생성되는 그거) 끄기 */
  }
  .bar-bg { width: 90px; height: 6px; background: rgba(0, 0, 0, 0.4); border-radius: 4px; overflow: hidden; margin-top: 6px; }
  .bar-fill { height: 100%; background: #4caf50; width: 0%; transition: width .3s; }
</style>
</head>
<body>
  <img id="sprite" src="" alt="" title="" draggable="false" />
  <div class="bar-bg"><div class="bar-fill" id="bar"></div></div>

  <script>
    const TIER_COLORS = { common: "#6c757d", uncommon: "#2f9e44", epic: "#4c6ef5", legendary: "#f59f00", mythical: "#e64980" };
    const sprite = document.getElementById("sprite");
    const bar = document.getElementById("bar");

    function render(s) {
      if (s.sprite) sprite.src = s.sprite;
      sprite.style.setProperty("--tier-color", s.tier && TIER_COLORS[s.tier] ? TIER_COLORS[s.tier] : "transparent");

      const needed = s.needed;
      const pct = needed ? Math.min(100, Math.round((s.progress / needed) * 100)) : 100;
      bar.style.width = pct + "%";

      sprite.title =
        s.state === "egg"
          ? `🥚 알 · ${s.progress.toLocaleString()} / ${needed.toLocaleString()} 토큰 (${pct}%)`
          : `${s.label}${s.isShiny ? " ✨" : ""} · ${s.progress.toLocaleString()}${needed != null ? " / " + needed.toLocaleString() : ""} 토큰 (${pct}%)`;
    }

    function poll() {
      window.api.getStatus().then(render);
    }
    poll();
    setInterval(poll, 20_000); // 아래 onStatusUpdate가 즉시 갱신을 대부분 커버하니 이건 안전망 정도
    window.api.onStatusUpdate(render); // 부화/진화/졸업/다시 키우기 등으로 바뀌는 즉시 반영

    // 드래그를 직접 구현(−webkit-app-region: drag는 Windows에서 더블클릭이랑
    // 같이 쓰면 더블클릭이 씹히는 문제가 있어서 — 실제로 겪음). Pointer Events +
    // setPointerCapture를 씀 — 일반 mouse 이벤트로 하면 창이 워낙 작아서(108x134)
    // 빠르게 드래그할 때 커서가 창 밖으로 나가버려 mousemove/mouseup을 못 받고
    // (실제로 겪음: 이미지 기본 드래그앤드롭이 대신 발동해서 바탕화면에 이미지가
    // 생성되거나, mouseup을 못 받아 놓아도 계속 따라오는 문제가 있었음) —
    // pointer capture는 커서가 창 밖으로 나가도 놓을 때까지 이벤트를 계속 이
    // 요소로 보내줘서 그 문제가 없음.
    const root = document.documentElement;
    let dragOrigin = null;
    let didDrag = false;

    root.addEventListener("pointerdown", async (e) => {
      if (e.button !== 0) return;
      didDrag = false;
      root.setPointerCapture(e.pointerId);
      const [winX, winY] = await window.api.getWidgetPosition();
      dragOrigin = { pointerId: e.pointerId, mouseX: e.screenX, mouseY: e.screenY, winX, winY };
    });
    root.addEventListener("pointermove", (e) => {
      if (!dragOrigin || e.pointerId !== dragOrigin.pointerId) return;
      const dx = e.screenX - dragOrigin.mouseX;
      const dy = e.screenY - dragOrigin.mouseY;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) didDrag = true;
      if (didDrag) window.api.moveWidgetTo(dragOrigin.winX + dx, dragOrigin.winY + dy);
    });
    function endDrag(e) {
      if (dragOrigin && e.pointerId === dragOrigin.pointerId && root.hasPointerCapture(e.pointerId)) {
        root.releasePointerCapture(e.pointerId);
      }
      dragOrigin = null;
    }
    root.addEventListener("pointerup", endDrag);
    root.addEventListener("pointercancel", endDrag);

    // 혹시 모를 이미지 기본 드래그(브라우저 밖으로 끌면 파일 생성되는 그거) 안전망.
    sprite.addEventListener("dragstart", (e) => e.preventDefault());

    // 전체 창은 더블클릭이 아니라 우클릭 메뉴("전체 창 보기")로만 연다 — 더블클릭은
    // Windows에서 이 작은 창 위에서 잘 안 먹는 경우가 있어(실제로 겪음) 아예 안 씀.
    document.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      window.api.widgetContextMenu();
    });
  </script>
</body>
</html>
