<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>PokeTokenLite</title>
<style>
  body { font-family: sans-serif; text-align: center; padding: 16px; background: #1e1e2e; color: #eee; }
  img { width: 96px; image-rendering: pixelated; }
  .bar-bg { background: #333; border-radius: 8px; height: 14px; overflow: hidden; margin-top: 12px; }
  .bar-fill { background: #4caf50; height: 100%; width: 0%; transition: width .3s; }
  button {
    margin-top: 14px; padding: 6px 14px; border: none; border-radius: 6px;
    background: #333; color: #eee; cursor: pointer; font-size: 13px;
  }
  button:hover { background: #444; }
  button:disabled { opacity: .5; cursor: default; }

  .tabs { display: flex; gap: 6px; justify-content: center; margin-bottom: 16px; }
  .tab {
    padding: 5px 12px; border: none; border-radius: 999px; margin-top: 0;
    background: #2a2a3a; color: #aaa; font-size: 12px;
  }
  .tab.active { background: #4c6ef5; color: #fff; }
  .coming-soon { color: #888; font-size: 13px; padding: 40px 0; }

  .name-row { display: flex; align-items: center; justify-content: center; gap: 6px; }
  .tier-badge {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: 10px; font-weight: bold; letter-spacing: .03em; color: #fff;
  }
  .tier-badge.common { background: #6c757d; }
  .tier-badge.rare { background: #4c6ef5; }
  .tier-badge.legendary { background: #f59f00; }

  .link-btn {
    margin-top: 6px; background: none; padding: 0; font-size: 13px;
    color: #74c0fc; text-decoration: underline;
  }
  .link-btn:hover { background: none; color: #a5d8ff; }

  #pokedex-subview { text-align: left; }
  .pokedex-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .pokedex-header h3 { margin: 0; font-size: 15px; }
  .pokedex-list { max-height: 300px; overflow-y: auto; }
  .pokedex-row {
    display: flex; align-items: center; gap: 8px; padding: 6px 4px;
    border-bottom: 1px solid #2a2a3a;
  }
  .pokedex-row img { width: 32px; height: 32px; image-rendering: pixelated; margin: 0; }
  .pokedex-row { cursor: pointer; flex-direction: column; align-items: stretch; }
  .pokedex-row .row-main { display: flex; align-items: center; gap: 8px; }
  .pokedex-row .name { flex: 1; font-size: 13px; }
  .pokedex-row .dex-no { font-size: 10px; color: #666; width: 34px; }
  .pokedex-row .date { font-size: 10px; color: #888; }
  .pokedex-row .raise-btn { margin: 0; padding: 3px 8px; font-size: 11px; }
  .pokedex-empty { color: #888; font-size: 13px; padding: 24px 0; text-align: center; }

  .evo-chain { display: none; gap: 10px; padding: 8px 4px 2px 42px; align-items: center; }
  .evo-chain.expanded { display: flex; }
  .evo-chain .evo-step { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .evo-chain img { width: 28px; height: 28px; margin: 0; }
  .evo-chain .evo-name { font-size: 10px; color: #bbb; }
  .evo-chain .evo-arrow { color: #666; font-size: 12px; }

  .egg-row { display: flex; align-items: center; gap: 8px; padding: 8px 4px; border-bottom: 1px solid #2a2a3a; }
  .egg-row .egg-icon { font-size: 22px; }
  .egg-row .egg-grade { flex: 1; font-size: 13px; }

  #nextHint { color: #888; font-size: 11px; margin-top: 4px; }
  #eggBoxLink { color: #ffd43b; }
</style>
</head>
<body>
  <div class="tabs">
    <button class="tab active" data-tool="claude-code">Claude Code</button>
    <button class="tab" data-tool="codex">Codex</button>
    <button class="tab" data-tool="gemini">Gemini</button>
  </div>

  <div id="claude-code-view">
    <div id="companion-subview">
      <div class="name-row">
        <h3 id="name">불러오는 중...</h3>
        <span id="tierBadge" class="tier-badge" hidden></span>
      </div>
      <img id="sprite" src="" alt="" />
      <div class="bar-bg"><div class="bar-fill" id="bar"></div></div>
      <p id="progress"></p>
      <p id="nextHint" hidden>다음 포켓몬: ???</p>
      <button id="pokedexLink" class="link-btn"></button>
      <br />
      <button id="storageLink" class="link-btn"></button>
      <br />
      <button id="eggBoxLink" class="link-btn"></button>
      <br />
      <button id="refreshBtn">🔄 새로고침</button>
    </div>

    <div id="pokedex-subview" hidden>
      <div class="pokedex-header">
        <button id="backBtn" class="link-btn">← 뒤로</button>
        <h3 id="pokedexTitle">도감</h3>
      </div>
      <div id="pokedexList" class="pokedex-list"></div>
    </div>

    <div id="storage-subview" hidden>
      <div class="pokedex-header">
        <button id="storageBackBtn" class="link-btn">← 뒤로</button>
        <h3 id="storageTitle">보관함</h3>
      </div>
      <div id="storageList" class="pokedex-list"></div>
    </div>

    <div id="eggbox-subview" hidden>
      <div class="pokedex-header">
        <button id="eggBoxBackBtn" class="link-btn">← 뒤로</button>
        <h3 id="eggBoxTitle">알 보관함</h3>
      </div>
      <div id="eggBoxList" class="pokedex-list"></div>
    </div>
  </div>

  <div id="coming-soon-view" class="coming-soon" hidden>다음 라운드에 지원 예정입니다.</div>

  <script>
    const tabs = document.querySelectorAll(".tab");
    const claudeCodeView = document.getElementById("claude-code-view");
    const comingSoonView = document.getElementById("coming-soon-view");

    tabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        tabs.forEach((t) => t.classList.remove("active"));
        tab.classList.add("active");

        const isClaudeCode = tab.dataset.tool === "claude-code";
        claudeCodeView.hidden = !isClaudeCode;
        comingSoonView.hidden = isClaudeCode;
      });
    });

    const TIER_LABELS = { common: "COMMON", rare: "RARE", legendary: "LEGENDARY" };

    function formatDexNo(speciesId) {
      return "#" + String(speciesId).padStart(3, "0");
    }

    function render(s) {
      document.getElementById("name").textContent = s.label + (s.isShiny ? " ✨" : "");

      const tierBadge = document.getElementById("tierBadge");
      if (s.tier) {
        tierBadge.textContent = TIER_LABELS[s.tier] ?? s.tier.toUpperCase();
        tierBadge.className = `tier-badge ${s.tier}`;
        tierBadge.hidden = false;
      } else {
        tierBadge.hidden = true;
      }

      const sprite = document.getElementById("sprite");
      if (s.sprite) {
        sprite.src = s.sprite;
        sprite.hidden = false;
      } else {
        sprite.hidden = true;
      }

      const pct = s.needed ? Math.min(100, Math.round((s.progress / s.needed) * 100)) : 100;
      document.getElementById("bar").style.width = pct + "%";
      document.getElementById("progress").textContent =
        s.needed != null
          ? `${s.progress.toLocaleString()} / ${s.needed.toLocaleString()} 토큰`
          : `${s.progress.toLocaleString()} 토큰`;

      document.getElementById("nextHint").hidden = !s.hasNextEvolution;

      document.getElementById("pokedexLink").textContent = `도감 ${s.pokedexCount}/151 보기 →`;
      document.getElementById("storageLink").textContent = `📦 보관함 ${s.storedCount}마리 보기 →`;
      document.getElementById("eggBoxLink").textContent = `🥚 알 보관함 ${s.eggBoxCount}개 보기 →`;
    }

    window.api.getStatus().then(render);

    const refreshBtn = document.getElementById("refreshBtn");
    refreshBtn.addEventListener("click", () => {
      refreshBtn.disabled = true;
      refreshBtn.textContent = "새로고침 중...";
      window.api.refresh().then((s) => {
        render(s);
        refreshBtn.disabled = false;
        refreshBtn.textContent = "🔄 새로고침";
      });
    });

    // --- 도감 보기 ---
    const companionSubview = document.getElementById("companion-subview");
    const pokedexSubview = document.getElementById("pokedex-subview");
    const pokedexList = document.getElementById("pokedexList");

    function formatDate(iso) {
      const d = new Date(iso);
      return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")}`;
    }

    function renderPokedex(entries) {
      document.getElementById("pokedexTitle").textContent = `도감 (${entries.length}/151)`;

      if (entries.length === 0) {
        pokedexList.innerHTML = `<div class="pokedex-empty">아직 졸업한 포켓몬이 없어요.<br />계속 키워보세요!</div>`;
        return;
      }

      pokedexList.innerHTML = entries
        .map(
          (e, i) => `
            <div class="pokedex-row" data-row-index="${i}">
              <div class="row-main">
                <span class="dex-no">${formatDexNo(e.speciesId)}</span>
                <img src="${e.sprite}" alt="${e.nameKo}" />
                <span class="name">${e.nameKo}${e.isShiny ? " ✨" : ""} <span class="tier-badge ${e.tier}" style="font-size:9px;padding:1px 6px;">${TIER_LABELS[e.tier] ?? e.tier}</span></span>
                <span class="date">${formatDate(e.graduatedAt)}</span>
              </div>
              <div class="evo-chain" data-chain-index="${i}">
                ${e.evolutionChain
                  .map(
                    (step, si) => `
                      ${si > 0 ? '<span class="evo-arrow">→</span>' : ""}
                      <div class="evo-step">
                        <img src="${step.sprite}" alt="${step.nameKo}" />
                        <span class="evo-name">${step.nameKo}</span>
                      </div>`
                  )
                  .join("")}
              </div>
            </div>`
        )
        .join("");
    }

    // 도감 행을 클릭하면 그 종의 진화 라인(미진화→...→최종진화)을 나열해서 보여줌.
    // 나중엔 여기를 눌렀을 때 상세 정보 팝업으로 바꿀 예정.
    pokedexList.addEventListener("click", (ev) => {
      const row = ev.target.closest(".pokedex-row");
      if (!row) return;
      const chain = row.querySelector(".evo-chain");
      chain.classList.toggle("expanded");
    });

    document.getElementById("pokedexLink").addEventListener("click", () => {
      companionSubview.hidden = true;
      pokedexSubview.hidden = false;
      window.api.getPokedex().then(renderPokedex);
    });

    document.getElementById("backBtn").addEventListener("click", () => {
      pokedexSubview.hidden = true;
      companionSubview.hidden = false;
    });

    // --- 보관함 보기 ---
    const storageSubview = document.getElementById("storage-subview");
    const storageList = document.getElementById("storageList");

    function renderStorage(entries) {
      document.getElementById("storageTitle").textContent = `보관함 (${entries.length}마리)`;

      if (entries.length === 0) {
        storageList.innerHTML = `<div class="pokedex-empty">보관 중인 포켓몬이 없어요.<br />도감에서 다른 애를 키우기 시작하면<br />지금 키우던 애가 여기로 들어와요.</div>`;
        return;
      }

      storageList.innerHTML = entries
        .map(
          (e) => `
            <div class="pokedex-row">
              <span class="dex-no">${formatDexNo(e.speciesId)}</span>
              <img src="${e.sprite}" alt="${e.nameKo}" />
              <span class="name">${e.nameKo}${e.isShiny ? " ✨" : ""} <span class="tier-badge ${e.tier}" style="font-size:9px;padding:1px 6px;">${TIER_LABELS[e.tier] ?? e.tier}</span></span>
              <button class="raise-btn" data-index="${e.index}">다시 키우기</button>
            </div>`
        )
        .join("");
    }

    storageList.addEventListener("click", (ev) => {
      const btn = ev.target.closest(".raise-btn");
      if (!btn) return;

      const index = Number(btn.dataset.index);
      btn.disabled = true;
      window.api.resumeStored(index).then((result) => {
        if (!result.ok) {
          btn.disabled = false;
          return;
        }
        render(result.status);
        storageSubview.hidden = true;
        companionSubview.hidden = false;
      });
    });

    document.getElementById("storageLink").addEventListener("click", () => {
      companionSubview.hidden = true;
      storageSubview.hidden = false;
      window.api.getStorage().then(renderStorage);
    });

    document.getElementById("storageBackBtn").addEventListener("click", () => {
      storageSubview.hidden = true;
      companionSubview.hidden = false;
    });

    // --- 알 보관함 보기 ---
    const eggBoxSubview = document.getElementById("eggbox-subview");
    const eggBoxList = document.getElementById("eggBoxList");
    const GRADE_ICON = { common: "🥚", rare: "🐣", legendary: "🌟" };

    function renderEggBox(eggs) {
      document.getElementById("eggBoxTitle").textContent = `알 보관함 (${eggs.length}개)`;

      if (eggs.length === 0) {
        eggBoxList.innerHTML = `<div class="pokedex-empty">알이 없어요.<br />진화/졸업할 때마다 등급 알이 하나씩 쌓여요.</div>`;
        return;
      }

      eggBoxList.innerHTML = eggs
        .map(
          (e) => `
            <div class="egg-row">
              <span class="egg-icon">${GRADE_ICON[e.grade] ?? "🥚"}</span>
              <span class="egg-grade">${TIER_LABELS[e.grade] ?? e.grade} 알 <span class="tier-badge ${e.grade}" style="font-size:9px;padding:1px 6px;">${e.grade === "common" ? "이상" : e.grade + " 이상"}</span></span>
              <button class="hatch-btn" data-egg-id="${e.id}">부화</button>
            </div>`
        )
        .join("");
    }

    eggBoxList.addEventListener("click", (ev) => {
      const btn = ev.target.closest(".hatch-btn");
      if (!btn) return;

      const eggId = btn.dataset.eggId;
      btn.disabled = true;
      window.api.hatchEgg(eggId).then((result) => {
        if (!result.ok) {
          btn.disabled = false;
          return;
        }
        render(result.status);
        eggBoxSubview.hidden = true;
        companionSubview.hidden = false;
      });
    });

    document.getElementById("eggBoxLink").addEventListener("click", () => {
      companionSubview.hidden = true;
      eggBoxSubview.hidden = false;
      window.api.getEggBox().then(renderEggBox);
    });

    document.getElementById("eggBoxBackBtn").addEventListener("click", () => {
      eggBoxSubview.hidden = true;
      companionSubview.hidden = false;
    });
  </script>
</body>
</html>
