<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>PokeTokenLite</title>
<style>
  body { font-family: sans-serif; text-align: center; padding: 16px; background: #1e1e2e; color: #eee; }
  img { width: 96px; image-rendering: pixelated; }
  .bar-bg { background: #333; border-radius: 8px; height: 14px; overflow: hidden; margin-top: 12px; }
  .bar-fill { background: #4caf50; height: 100%; width: 0%; transition: width .3s; }
  .boost-bar-bg { margin-top: 6px; height: 10px; }
  .boost-bar-fill { background: #ff9800; }
  #boostProgressText { font-size: 11px; color: #ffb74d; margin: 2px 0 0; }
  button {
    margin-top: 14px; padding: 6px 14px; border: none; border-radius: 6px;
    background: #333; color: #eee; cursor: pointer; font-size: 13px;
  }
  button:hover { background: #444; }
  button:disabled { opacity: .5; cursor: default; }

  .tabs { display: flex; gap: 6px; justify-content: center; margin-bottom: 16px; }
  .tab {
    padding: 5px 12px; border: none; border-radius: 999px; margin-top: 0;
    background: #2a2a3a; color: #aaa; font-size: 12px;
  }
  .tab.active { background: #4c6ef5; color: #fff; }
  .coming-soon { color: #888; font-size: 13px; padding: 40px 0; }

  .name-row { display: flex; align-items: center; justify-content: center; gap: 6px; }
  .tier-badge {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: 10px; font-weight: bold; letter-spacing: .03em; color: #fff;
  }
  .tier-badge.common { background: #6c757d; }
  .tier-badge.uncommon { background: #2f9e44; }
  .tier-badge.epic { background: #4c6ef5; }
  .tier-badge.legendary { background: #f59f00; }
  .tier-badge.mythical { background: #e64980; }

  .link-btn {
    margin-top: 6px; background: none; padding: 0; font-size: 13px;
    color: #74c0fc; text-decoration: underline;
  }
  .link-btn:hover { background: none; color: #a5d8ff; }

  #pokedex-subview { text-align: left; }
  .pokedex-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .pokedex-header h3 { margin: 0; font-size: 15px; }
  .pokedex-list { max-height: 300px; overflow-y: auto; }
  .pokedex-row {
    display: flex; align-items: center; gap: 8px; padding: 6px 4px;
    border-bottom: 1px solid #2a2a3a;
  }
  .pokedex-row img { width: 32px; height: 32px; image-rendering: pixelated; margin: 0; }
  .pokedex-row { cursor: pointer; flex-direction: column; align-items: stretch; }
  .pokedex-row .row-main { display: flex; align-items: center; gap: 8px; }
  .pokedex-row .name { flex: 1; font-size: 13px; }
  .pokedex-row .dex-no { font-size: 10px; color: #666; width: 34px; }
  .pokedex-row .date { font-size: 10px; color: #888; }
  .dex-count { font-size: 10px; color: #74c0fc; }
  .pokedex-row .raise-btn { margin: 0; padding: 3px 8px; font-size: 11px; }
  .pokedex-empty { color: #888; font-size: 13px; padding: 24px 0; text-align: center; }

  #settings-subview { text-align: left; }
  .settings-list { display: flex; flex-direction: column; gap: 14px; }
  .settings-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; font-size: 13px;
  }
  .settings-row select, .settings-row input[type="checkbox"] { margin: 0; }
  .settings-row-col { flex-direction: column; align-items: stretch; gap: 4px; }
  .settings-row-col input[type="range"] { width: 100%; margin: 0; }
  .settings-hint { font-size: 10px; color: #888; }
  .pokedex-row.locked { opacity: 0.45; cursor: default; }
  .pokedex-row .dex-unknown-img {
    width: 32px; height: 32px; border-radius: 4px; background: #333;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: #888;
  }

  .evo-chain { display: none; flex-direction: column; gap: 8px; padding: 8px 4px 2px 42px; }
  .evo-chain.expanded { display: flex; }
  .evo-chain-steps { display: flex; gap: 10px; align-items: center; }
  .evo-chain .evo-step { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .evo-chain img { width: 28px; height: 28px; margin: 0; }
  .evo-chain .evo-name { font-size: 10px; color: #bbb; }
  .evo-chain .evo-arrow { color: #666; font-size: 12px; }
  .evo-chain .evo-unknown-img {
    width: 28px; height: 28px; border-radius: 4px; background: #333;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: #888;
  }
  .dex-detail { display: flex; flex-direction: column; gap: 6px; }
  .type-badge {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: 10px; font-weight: bold; letter-spacing: .03em; color: #fff;
    background: #495057; margin-right: 4px;
  }
  .dex-desc { font-size: 11px; color: #aaa; line-height: 1.4; }

  .egg-row { display: flex; align-items: center; gap: 8px; padding: 8px 4px; border-bottom: 1px solid #2a2a3a; }
  .egg-row .egg-icon { font-size: 22px; }
  .egg-row .egg-grade { flex: 1; font-size: 13px; }

  .shop-wallet {
    padding: 10px; margin-bottom: 8px; background: #23233a; border-radius: 8px;
  }
  .shop-wallet-label { font-size: 11px; color: #888; }
  .shop-wallet-amount { font-size: 20px; font-weight: bold; margin: 2px 0; }
  .shop-wallet-hint { font-size: 10px; color: #666; }
  .shop-row-desc { display: block; font-size: 10px; color: #888; margin-top: 2px; }

  #nextHint { color: #888; font-size: 11px; margin-top: 4px; }
  #eggBoxLink { color: #ffd43b; }

  @keyframes evolve-flash {
    0% { filter: brightness(1) saturate(1); transform: scale(1); }
    40% { filter: brightness(3) saturate(0); transform: scale(1.25); }
    100% { filter: brightness(1) saturate(1); transform: scale(1); }
  }
  #sprite.evolving { animation: evolve-flash 0.7s ease-in-out; }
  #name.evolving { animation: evolve-flash 0.7s ease-in-out; }

  /* 알 부화 진행률에 따라 점점 더 세게 흔들림(0~24%는 안 흔들림). 실제 게임도
     알 자체엔 프레임 애니메이션이 없고 "흔들림" 연출만 있어서 CSS로 직접 구현 */
  @keyframes egg-shake {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(var(--egg-shake-angle, 3deg)); }
    75% { transform: rotate(calc(var(--egg-shake-angle, 3deg) * -1)); }
  }
  #sprite.egg-shake-25 { animation: egg-shake 1.1s ease-in-out infinite; --egg-shake-angle: 3deg; }
  #sprite.egg-shake-50 { animation: egg-shake 0.75s ease-in-out infinite; --egg-shake-angle: 5deg; }
  #sprite.egg-shake-75 { animation: egg-shake 0.45s ease-in-out infinite; --egg-shake-angle: 8deg; }

  /* "다시 키우기"(보관함에서 교체) 전용 전환 — 흰 빛 + 몬스터볼로 들어갔다 나오는 연출.
     evolve-flash(진화/부화/졸업용)랑 트리거 구분해서 따로 둠 — 교체는 진화가 아니니까. */
  .sprite-wrap { position: relative; display: inline-block; }
  #pokeball {
    position: absolute; left: 50%; bottom: 6px; width: 28px; height: 28px;
    transform: translateX(-50%) scale(0.5); opacity: 0; pointer-events: none;
  }
  @keyframes pokeball-recall-sprite {
    0% { transform: scale(1); filter: brightness(1) saturate(1); opacity: 1; }
    35% { transform: scale(0.15); filter: brightness(3) saturate(0); opacity: 1; }
    50%, 65% { transform: scale(0); filter: brightness(3) saturate(0); opacity: 0; }
    80% { transform: scale(0.15); filter: brightness(3) saturate(0); opacity: 1; }
    100% { transform: scale(1); filter: brightness(1) saturate(1); opacity: 1; }
  }
  @keyframes pokeball-recall-ball {
    0%, 30% { transform: translateX(-50%) scale(0.5); opacity: 0; }
    50% { transform: translateX(-50%) scale(1.2); opacity: 1; }
    65% { transform: translateX(-50%) scale(1); opacity: 1; }
    85%, 100% { transform: translateX(-50%) scale(0.5); opacity: 0; }
  }
  #sprite.recalling { animation: pokeball-recall-sprite 0.9s ease-in-out; transform-origin: center bottom; }
  #pokeball.recalling { animation: pokeball-recall-ball 0.9s ease-in-out; }

  /* 스프라이트 클릭하면 살짝 통통 튀는 반응 — 장식용 인터랙션, 게임 로직과 무관 */
  #sprite { cursor: pointer; }
  @keyframes poke-bounce {
    0% { transform: scale(1) translateY(0); }
    20% { transform: scale(1.08, 0.9) translateY(0); }
    45% { transform: scale(0.94, 1.1) translateY(-16px); }
    65% { transform: scale(1.04, 0.97) translateY(0); }
    82% { transform: scale(0.98, 1.02) translateY(-4px); }
    100% { transform: scale(1) translateY(0); }
  }
  #sprite.poked { animation: poke-bounce 0.5s ease-in-out; }
</style>
</head>
<body>
  <div class="tabs">
    <button class="tab active" data-tool="claude-code">Claude Code</button>
    <button class="tab" data-tool="codex">Codex</button>
    <button class="tab" data-tool="gemini">Gemini</button>
  </div>

  <div id="claude-code-view">
    <div id="companion-subview">
      <div class="name-row">
        <h3 id="name">불러오는 중...</h3>
        <span id="tierBadge" class="tier-badge" hidden></span>
      </div>
      <div class="sprite-wrap">
        <img id="sprite" src="" alt="" />
        <img id="pokeball" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png" alt="" />
      </div>
      <div class="bar-bg"><div class="bar-fill" id="bar"></div></div>
      <p id="progress"></p>
      <div class="bar-bg boost-bar-bg" id="boostBarWrap" hidden><div class="bar-fill boost-bar-fill" id="boostBar"></div></div>
      <p id="boostProgressText" hidden></p>
      <p id="nextHint" hidden>다음 포켓몬: ???</p>
      <button id="pokedexLink" class="link-btn"></button>
      <br />
      <button id="storageLink" class="link-btn"></button>
      <br />
      <button id="eggBoxLink" class="link-btn"></button>
      <br />
      <button id="refreshBtn">🔄 새로고침</button>
      <button id="boxAndNewEggBtn" hidden>📦 보관하고 새 알 시작</button>
      <button id="boostBtn" hidden>🔥 부스트</button>
      <button id="widgetBtn">🔘 위젯으로 보기</button>
      <br />
      <button id="settingsLink" class="link-btn">⚙️ 설정</button>
      <br />
      <button id="shopLink" class="link-btn">🛍️ 상점</button>
      <button id="bagLink" class="link-btn">🎒 가방</button>
    </div>

    <div id="pokedex-subview" hidden>
      <div class="pokedex-header">
        <button id="backBtn" class="link-btn">← 뒤로</button>
        <h3 id="pokedexTitle">도감</h3>
      </div>
      <div id="pokedexList" class="pokedex-list"></div>
    </div>

    <div id="storage-subview" hidden>
      <div class="pokedex-header">
        <button id="storageBackBtn" class="link-btn">← 뒤로</button>
        <h3 id="storageTitle">보관함</h3>
      </div>
      <div id="storageList" class="pokedex-list"></div>
    </div>

    <div id="eggbox-subview" hidden>
      <div class="pokedex-header">
        <button id="eggBoxBackBtn" class="link-btn">← 뒤로</button>
        <h3 id="eggBoxTitle">알 보관함</h3>
      </div>
      <div id="eggBoxList" class="pokedex-list"></div>
    </div>

    <div id="settings-subview" hidden>
      <div class="pokedex-header">
        <button id="settingsBackBtn" class="link-btn">← 뒤로</button>
        <h3>설정</h3>
      </div>
      <div class="settings-list">
        <label class="settings-row">
          <span>새로고침 주기</span>
          <select id="pollIntervalSelect">
            <option value="1">1분</option>
            <option value="2">2분</option>
            <option value="5">5분</option>
            <option value="10">10분</option>
          </select>
        </label>
        <label class="settings-row">
          <span>부화 가중치(희귀도 반영)</span>
          <input type="checkbox" id="hatchWeightingCheck" />
        </label>
        <div class="settings-row settings-row-col">
          <span>난이도 <span id="difficultyValue"></span></span>
          <input type="range" id="difficultySlider" min="0.1" max="2" step="0.1" />
          <span class="settings-hint">낮을수록 빠르고 쉬움 · 높을수록 느리고 어려움</span>
        </div>
        <label class="settings-row">
          <span>Windows 알림</span>
          <input type="checkbox" id="notificationsCheck" />
        </label>
        <label class="settings-row">
          <span>Windows 시작 시 자동 실행</span>
          <input type="checkbox" id="openAtLoginCheck" />
        </label>
      </div>
    </div>

    <div id="shop-subview" hidden>
      <div class="pokedex-header">
        <button id="shopBackBtn" class="link-btn">← 뒤로</button>
        <h3>상점</h3>
      </div>
      <div class="shop-wallet">
        <div class="shop-wallet-label">사용 가능 토큰</div>
        <div class="shop-wallet-amount" id="shopWalletAmount">0</div>
        <div class="shop-wallet-hint">누적 토큰 − 상점에서 이미 쓴 토큰이에요. 성장 진행과는 무관해요.</div>
      </div>
      <div id="shopList" class="pokedex-list"></div>
    </div>

    <div id="bag-subview" hidden>
      <div class="pokedex-header">
        <button id="bagBackBtn" class="link-btn">← 뒤로</button>
        <h3>가방</h3>
      </div>
      <div id="bagList" class="pokedex-list"></div>
    </div>
  </div>

  <div id="coming-soon-view" class="coming-soon" hidden>다음 라운드에 지원 예정입니다.</div>

  <script>
    const tabs = document.querySelectorAll(".tab");
    const claudeCodeView = document.getElementById("claude-code-view");
    const comingSoonView = document.getElementById("coming-soon-view");

    tabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        tabs.forEach((t) => t.classList.remove("active"));
        tab.classList.add("active");

        const isClaudeCode = tab.dataset.tool === "claude-code";
        claudeCodeView.hidden = !isClaudeCode;
        comingSoonView.hidden = isClaudeCode;
      });
    });

    const TIER_LABELS = { common: "COMMON", uncommon: "UNCOMMON", epic: "EPIC", legendary: "LEGENDARY", mythical: "MYTHICAL" };

    function formatDexNo(speciesId) {
      return "#" + String(speciesId).padStart(3, "0");
    }

    // 숫자를 스냅하지 않고 스르륵 세면서 올라가게(요청: "토큰 띠리리리하면서 올라가게").
    let progressAnimId = null;
    function animateProgressNumber(from, to, needed) {
      if (progressAnimId) cancelAnimationFrame(progressAnimId);
      if (from === to) {
        setProgressText(to, needed);
        return;
      }
      const start = performance.now();
      const duration = 500;
      function step(now) {
        const t = Math.min(1, (now - start) / duration);
        const eased = 1 - Math.pow(1 - t, 3); // ease-out
        setProgressText(Math.round(from + (to - from) * eased), needed);
        if (t < 1) progressAnimId = requestAnimationFrame(step);
      }
      progressAnimId = requestAnimationFrame(step);
    }

    function setProgressText(progress, needed) {
      const pct = needed ? Math.min(100, Math.round((progress / needed) * 100)) : 100;
      document.getElementById("bar").style.width = pct + "%";
      document.getElementById("progress").textContent =
        needed != null ? `${progress.toLocaleString()} / ${needed.toLocaleString()} 토큰` : `${progress.toLocaleString()} 토큰`;
    }

    let lastRendered = null; // 진화/부화/졸업으로 종이 바뀌었는지 비교용

    // transition: "evolve"(기본, 부화/진화/졸업 — 흰 빛만) | "recall"(보관함 "다시
    // 키우기" — 흰 빛 + 몬스터볼로 들어갔다 나옴). 교체는 진화가 아니라서 연출을 구분함.
    function render(s, transition) {
      const sprite = document.getElementById("sprite");
      const pokeball = document.getElementById("pokeball");
      const nameEl = document.getElementById("name");

      // 알 깨짐/진화/졸업/교체로 종 자체가 바뀐 경우 — 바로 전환하지 말고 잠깐 연출 후 바뀜
      const speciesChanged =
        lastRendered && (lastRendered.state !== s.state || lastRendered.speciesId !== s.speciesId);

      function applyContent() {
        nameEl.textContent = s.label + (s.isShiny ? " ✨" : "");

        const tierBadge = document.getElementById("tierBadge");
        if (s.tier) {
          tierBadge.textContent = TIER_LABELS[s.tier] ?? s.tier.toUpperCase();
          tierBadge.className = `tier-badge ${s.tier}`;
          tierBadge.hidden = false;
        } else {
          tierBadge.hidden = true;
        }

        if (s.sprite) {
          sprite.src = s.sprite;
          sprite.hidden = false;
        } else {
          sprite.hidden = true;
        }
      }

      if (speciesChanged) {
        const cls = transition === "recall" ? "recalling" : "evolving";
        const duration = transition === "recall" ? 900 : 700;
        const midpoint = transition === "recall" ? 450 : 300; // 애니메이션에서 화면이 완전히 가려지는 지점
        // 이전 전환이 아직 안 끝난 채로 새 전환이 시작되는 경우(연타 등) 클래스가 겹쳐
        // 쌓이지 않게 먼저 다 지우고 시작.
        sprite.classList.remove("evolving", "recalling");
        pokeball.classList.remove("recalling");
        sprite.classList.add(cls);
        nameEl.classList.add("evolving"); // 이름은 두 경우 다 그냥 반짝이기만
        if (transition === "recall") pokeball.classList.add("recalling");
        // CSS 애니메이션 자체가 duration짜리인데, 중간에 클래스를 지우면 애니메이션이
        // 뚝 끊기며 사실상 즉시 전환처럼 보임(evolve-flash에서 실제로 겪었던 버그) —
        // 내용 교체는 화면이 완전히 가려지는 중간 지점에서 하되, 클래스는 애니메이션이
        // 끝날 때까지 유지해야 끊기지 않고 끝까지 재생됨.
        setTimeout(() => {
          applyContent();
        }, midpoint);
        setTimeout(() => {
          sprite.classList.remove(cls);
          nameEl.classList.remove("evolving");
          pokeball.classList.remove("recalling");
        }, duration);
      } else {
        applyContent();
      }

      const fromProgress = lastRendered && !speciesChanged ? lastRendered.progress : s.progress;
      animateProgressNumber(fromProgress, s.progress, s.needed);

      // 알 상태면 부화 진행률(%)에 따라 흔들림 세기를 올림 — 알이 아니면 흔들림 없음.
      sprite.classList.remove("egg-shake-25", "egg-shake-50", "egg-shake-75");
      if (s.state === "egg") {
        const pct = s.needed ? (s.progress / s.needed) * 100 : 0;
        if (pct >= 75) sprite.classList.add("egg-shake-75");
        else if (pct >= 50) sprite.classList.add("egg-shake-50");
        else if (pct >= 25) sprite.classList.add("egg-shake-25");
      }

      document.getElementById("nextHint").hidden = !s.hasNextEvolution;
      // 알 상태일 땐 보관할 대상이 없으니 숨김 — 성장 중일 때만 노출.
      document.getElementById("boxAndNewEggBtn").hidden = s.state !== "growing";

      // 부스트 — 성장 중일 때만 토글 버튼 노출, 부스팅 중엔 라벨 전환 + 보조 게이지 바.
      const boostBtn = document.getElementById("boostBtn");
      boostBtn.hidden = s.state !== "growing";
      boostBtn.textContent = s.boosting ? "🔥 부스트 중... (취소)" : "🔥 부스트";
      document.getElementById("boostBarWrap").hidden = !s.boosting;
      document.getElementById("boostProgressText").hidden = !s.boosting;
      if (s.boosting) {
        const boostPct = Math.min(100, Math.round((s.boostProgress / s.boostNeeded) * 100));
        document.getElementById("boostBar").style.width = boostPct + "%";
        document.getElementById("boostProgressText").textContent =
          `🔥 ${s.boostProgress.toLocaleString()} / ${s.boostNeeded.toLocaleString()} 토큰`;
      }

      document.getElementById("pokedexLink").textContent = `도감 ${s.pokedexCount}/${s.pokedexTotal} 보기 →`;
      document.getElementById("storageLink").textContent = `📦 보관함 ${s.storedCount}마리 보기 →`;
      document.getElementById("eggBoxLink").textContent = `🥚 알 보관함 ${s.eggBoxCount}개 보기 →`;

      lastRendered = s;
    }

    // 스프라이트 클릭하면 통통 튀는 반응(장식용, 게임 상태엔 영향 없음). 진화/다시
    // 키우기 연출 도중엔 같은 요소에서 애니메이션이 겹치지 않게 무시.
    document.getElementById("sprite").addEventListener("click", () => {
      const spriteEl = document.getElementById("sprite");
      if (spriteEl.classList.contains("evolving") || spriteEl.classList.contains("recalling")) return;
      spriteEl.classList.remove("poked");
      void spriteEl.offsetWidth; // 강제 리플로우 — 연타해도 애니메이션이 처음부터 다시 재생되게
      spriteEl.classList.add("poked");
      setTimeout(() => spriteEl.classList.remove("poked"), 500);
    });

    window.api.getStatus().then(render);

    const refreshBtn = document.getElementById("refreshBtn");
    refreshBtn.addEventListener("click", () => {
      refreshBtn.disabled = true;
      refreshBtn.textContent = "새로고침 중...";
      window.api.refresh().then((s) => {
        render(s);
        refreshBtn.disabled = false;
        refreshBtn.textContent = "🔄 새로고침";
      });
    });

    const boxAndNewEggBtn = document.getElementById("boxAndNewEggBtn");
    boxAndNewEggBtn.addEventListener("click", () => {
      boxAndNewEggBtn.disabled = true;
      window.api.boxAndNewEgg().then((result) => {
        boxAndNewEggBtn.disabled = false;
        if (result.ok) {
          lastRendered = null; // 종이 바뀌었으니 반짝임 없이 바로 새 알로 전환
          render(result.status);
        }
      });
    });

    // 부스트 토글 — 켜면 진행도가 멈추고 게이지가 쌓이기 시작, 다시 누르면(게이지
    // 다 차기 전) 보상 없이 취소. 종 자체 바뀌는 연출은 없어서 lastRendered 유지.
    document.getElementById("boostBtn").addEventListener("click", () => {
      window.api.toggleBoost().then((result) => {
        if (result.status) render(result.status);
      });
    });

    // 위젯으로 전환 — 이 버튼을 누르면 지금 창(팝업) 자체가 닫히니 응답을 기다리지
    // 않고 그냥 호출만 함(닫히는 창에서 IPC 응답을 기다리면 안 옴).
    document.getElementById("widgetBtn").addEventListener("click", () => {
      window.api.enableWidget();
    });

    // 팝업이 열려있는 동안엔 수동으로 새로고침 안 눌러도 주기적으로 자동 갱신되게.
    // 서브뷰(도감/보관함/알보관함) 보는 중엔 화면이 안 바뀌니 컴패니언 화면일 때만.
    const AUTO_REFRESH_MS = 2 * 60 * 1000; // 2분 — 백그라운드 폴링 주기와 동일하게
    setInterval(() => {
      if (!companionSubviewVisible()) return;
      window.api.refresh().then(render);
    }, AUTO_REFRESH_MS);

    function companionSubviewVisible() {
      return !document.getElementById("companion-subview").hidden;
    }

    // --- 도감 보기 ---
    const companionSubview = document.getElementById("companion-subview");
    const pokedexSubview = document.getElementById("pokedex-subview");
    const pokedexList = document.getElementById("pokedexList");

    function formatDate(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")}`;
    }

    // entries는 이제 전체 종(발견 못 한 것도 포함) — discovered/total은 도감
    // 제목의 "N/전체" 표시용 발견 개수/전체 개수(둘 다 rows.length랑 다름에 주의).
    function renderPokedex({ discovered, total, rows: entries }) {
      document.getElementById("pokedexTitle").textContent = `도감 (${discovered}/${total})`;

      pokedexList.innerHTML = entries
        .map((e, i) => {
          if (!e.discovered) {
            return `
              <div class="pokedex-row locked" data-row-index="${i}">
                <div class="row-main">
                  <span class="dex-no">${formatDexNo(e.speciesId)}</span>
                  <div class="dex-unknown-img">?</div>
                  <span class="name">?????</span>
                </div>
              </div>`;
          }
          return `
            <div class="pokedex-row" data-row-index="${i}">
              <div class="row-main">
                <span class="dex-no">${formatDexNo(e.speciesId)}</span>
                <img src="${e.sprite}" alt="${e.nameKo}" />
                <span class="name">${e.nameKo}${e.isShiny ? " ✨" : ""} <span class="tier-badge ${e.tier}" style="font-size:9px;padding:1px 6px;">${TIER_LABELS[e.tier] ?? e.tier}</span>${e.count > 1 ? ` <span class="dex-count">${e.count}회 부화${e.shinyCount > 0 ? ` (✨${e.shinyCount})` : ""}</span>` : e.count === 0 && e.isLive ? ` <span class="dex-count">육성 중</span>` : ""}</span>
                <span class="date">${formatDate(e.graduatedAt)}</span>
              </div>
              <div class="evo-chain" data-chain-index="${i}">
                <div class="dex-detail">
                  <div class="dex-types">
                    ${(e.types || []).map((t) => `<span class="type-badge">${t}</span>`).join("")}
                  </div>
                  ${e.description ? `<p class="dex-desc">${e.description}</p>` : ""}
                </div>
                <div class="evo-chain-steps">
                  ${e.evolutionChain
                    .map(
                      (step, si) => `
                        ${si > 0 ? '<span class="evo-arrow">→</span>' : ""}
                        <div class="evo-step">
                          ${
                            step.discovered
                              ? `<img src="${step.sprite}" alt="${step.nameKo}" />`
                              : `<div class="evo-unknown-img">?</div>`
                          }
                          <span class="evo-name">${step.discovered ? step.nameKo : "?????"}</span>
                        </div>`
                    )
                    .join("")}
                </div>
              </div>
            </div>`;
        })
        .join("");
    }

    // 도감 행을 클릭하면 타입/설명 + 진화 라인(미진화→...→최종진화)을 펼쳐서 보여줌.
    // 발견 못 한(잠긴) 행은 펼칠 내용 자체가 없어서 무시.
    pokedexList.addEventListener("click", (ev) => {
      const row = ev.target.closest(".pokedex-row");
      if (!row) return;
      const chain = row.querySelector(".evo-chain");
      if (!chain) return;
      chain.classList.toggle("expanded");
    });

    document.getElementById("pokedexLink").addEventListener("click", () => {
      companionSubview.hidden = true;
      pokedexSubview.hidden = false;
      window.api.getPokedex().then(renderPokedex);
    });

    document.getElementById("backBtn").addEventListener("click", () => {
      pokedexSubview.hidden = true;
      companionSubview.hidden = false;
    });

    // --- 보관함 보기 ---
    const storageSubview = document.getElementById("storage-subview");
    const storageList = document.getElementById("storageList");

    function renderStorage(entries) {
      document.getElementById("storageTitle").textContent = `보관함 (${entries.length}마리)`;

      if (entries.length === 0) {
        storageList.innerHTML = `<div class="pokedex-empty">보관 중인 포켓몬이 없어요.<br />도감에서 다른 애를 키우기 시작하면<br />지금 키우던 애가 여기로 들어와요.</div>`;
        return;
      }

      storageList.innerHTML = entries
        .map(
          (e) => `
            <div class="pokedex-row">
              <span class="dex-no">${formatDexNo(e.speciesId)}</span>
              <img src="${e.sprite}" alt="${e.nameKo}" />
              <span class="name">${e.nameKo}${e.isShiny ? " ✨" : ""} <span class="tier-badge ${e.tier}" style="font-size:9px;padding:1px 6px;">${TIER_LABELS[e.tier] ?? e.tier}</span></span>
              <button class="raise-btn" data-index="${e.index}">다시 키우기</button>
            </div>`
        )
        .join("");
    }

    storageList.addEventListener("click", (ev) => {
      const btn = ev.target.closest(".raise-btn");
      if (!btn) return;

      const index = Number(btn.dataset.index);
      btn.disabled = true;
      window.api.resumeStored(index).then((result) => {
        if (!result.ok) {
          btn.disabled = false;
          return;
        }
        render(result.status, "recall");
        storageSubview.hidden = true;
        companionSubview.hidden = false;
      });
    });

    document.getElementById("storageLink").addEventListener("click", () => {
      companionSubview.hidden = true;
      storageSubview.hidden = false;
      window.api.getStorage().then(renderStorage);
    });

    document.getElementById("storageBackBtn").addEventListener("click", () => {
      storageSubview.hidden = true;
      companionSubview.hidden = false;
    });

    // --- 알 보관함 보기 ---
    const eggBoxSubview = document.getElementById("eggbox-subview");
    const eggBoxList = document.getElementById("eggBoxList");
    const GRADE_ICON = { common: "🥚", uncommon: "🐤", epic: "🐣", legendary: "🌟", mythical: "💠" };
    // "이 등급 알을 부화하면 뭐가 나오는지"를 명확한 말로 — "이상"만 덜렁 쓰면
    // 뭐 기준으로 이상인지 안 보여서 헷갈림(사용자가 직접 물어봐서 확인된 문제).
    const GRADE_HINT = {
      common: "전체 랜덤", uncommon: "언커먼 이상", epic: "에픽 이상",
      legendary: "레전더리 이상", mythical: "뮤 확정",
    };

    function renderEggBox(eggs) {
      document.getElementById("eggBoxTitle").textContent = `알 보관함 (${eggs.length}개)`;

      if (eggs.length === 0) {
        eggBoxList.innerHTML = `<div class="pokedex-empty">알이 없어요.<br />진화/졸업할 때마다 등급 알이 하나씩 쌓여요.</div>`;
        return;
      }

      eggBoxList.innerHTML = eggs
        .map(
          (e) => `
            <div class="egg-row">
              <span class="egg-icon">${GRADE_ICON[e.grade] ?? "🥚"}</span>
              <span class="egg-grade">${TIER_LABELS[e.grade] ?? e.grade} 알 <span class="tier-badge ${e.grade}" style="font-size:9px;padding:1px 6px;">${GRADE_HINT[e.grade] ?? e.grade}</span></span>
              <button class="hatch-btn" data-egg-id="${e.id}">품기 시작</button>
            </div>`
        )
        .join("");
    }

    eggBoxList.addEventListener("click", (ev) => {
      const btn = ev.target.closest(".hatch-btn");
      if (!btn) return;

      const eggId = btn.dataset.eggId;
      btn.disabled = true;
      window.api.incubateEgg(eggId).then((result) => {
        if (!result.ok) {
          btn.disabled = false;
          return;
        }
        render(result.status);
        eggBoxSubview.hidden = true;
        companionSubview.hidden = false;
      });
    });

    document.getElementById("eggBoxLink").addEventListener("click", () => {
      companionSubview.hidden = true;
      eggBoxSubview.hidden = false;
      window.api.getEggBox().then(renderEggBox);
    });

    document.getElementById("eggBoxBackBtn").addEventListener("click", () => {
      eggBoxSubview.hidden = true;
      companionSubview.hidden = false;
    });

    // --- 설정 보기 ---
    const settingsSubview = document.getElementById("settings-subview");
    const pollIntervalSelect = document.getElementById("pollIntervalSelect");
    const hatchWeightingCheck = document.getElementById("hatchWeightingCheck");
    const difficultySlider = document.getElementById("difficultySlider");
    const difficultyValue = document.getElementById("difficultyValue");
    const notificationsCheck = document.getElementById("notificationsCheck");
    const openAtLoginCheck = document.getElementById("openAtLoginCheck");

    function renderSettings(s) {
      pollIntervalSelect.value = String(s.pollIntervalMinutes);
      hatchWeightingCheck.checked = s.hatchWeightingEnabled;
      difficultySlider.value = s.difficulty;
      difficultyValue.textContent = `${s.difficulty}x`;
      notificationsCheck.checked = s.notificationsEnabled;
      openAtLoginCheck.checked = s.openAtLogin;
    }

    document.getElementById("settingsLink").addEventListener("click", () => {
      companionSubview.hidden = true;
      settingsSubview.hidden = false;
      window.api.getSettings().then(renderSettings);
    });
    document.getElementById("settingsBackBtn").addEventListener("click", () => {
      settingsSubview.hidden = true;
      companionSubview.hidden = false;
    });

    pollIntervalSelect.addEventListener("change", (e) => {
      window.api.updateSettings({ pollIntervalMinutes: Number(e.target.value) });
    });
    hatchWeightingCheck.addEventListener("change", (e) => {
      window.api.updateSettings({ hatchWeightingEnabled: e.target.checked });
    });
    // 슬라이더 드래그 중엔 숫자만 바로 갱신(가벼움), 손 뗄 때(change)만 실제로 저장.
    difficultySlider.addEventListener("input", (e) => {
      difficultyValue.textContent = `${e.target.value}x`;
    });
    difficultySlider.addEventListener("change", (e) => {
      window.api.updateSettings({ difficulty: Number(e.target.value) });
    });
    notificationsCheck.addEventListener("change", (e) => {
      window.api.updateSettings({ notificationsEnabled: e.target.checked });
    });
    openAtLoginCheck.addEventListener("change", (e) => {
      window.api.updateSettings({ openAtLogin: e.target.checked });
    });

    // --- 상점 보기 ---
    const shopSubview = document.getElementById("shop-subview");
    const shopList = document.getElementById("shopList");
    const shopWalletAmount = document.getElementById("shopWalletAmount");
    const ITEM_ICON = { rareCandy: "🍬", shinyCharm: "🍀" };

    function renderShop(shop) {
      shopWalletAmount.textContent = `${shop.spendableTokens.toLocaleString()} 토큰`;

      const rows = [];
      rows.push(`
        <div class="egg-row">
          <span class="egg-icon">${ITEM_ICON.rareCandy}</span>
          <span class="egg-grade">이상한 사탕<span class="shop-row-desc">가방에 보관, 나중에 사용하면 진행도 +${shop.rareCandy.price.toLocaleString()}</span></span>
          <button class="buy-btn" data-kind="rareCandy" ${shop.rareCandy.canBuy ? "" : "disabled"}>${shop.rareCandy.price.toLocaleString()} 구매</button>
        </div>`);

      if (shop.shinyCharm.owned) {
        rows.push(`
          <div class="egg-row">
            <span class="egg-icon">${ITEM_ICON.shinyCharm}</span>
            <span class="egg-grade">이로치 부적<span class="shop-row-desc">보유 중 — 이로치 확률 2배 적용됨</span></span>
            <span class="dex-count">✔ 보유</span>
          </div>`);
      } else {
        rows.push(`
          <div class="egg-row">
            <span class="egg-icon">${ITEM_ICON.shinyCharm}</span>
            <span class="egg-grade">이로치 부적<span class="shop-row-desc">1회 구매, 이로치 확률 영구 2배</span></span>
            <button class="buy-btn" data-kind="shinyCharm" ${shop.shinyCharm.canBuy ? "" : "disabled"}>${shop.shinyCharm.price.toLocaleString()} 구매</button>
          </div>`);
      }

      shop.eggs.forEach((e) => {
        rows.push(`
          <div class="egg-row">
            <span class="egg-icon">${GRADE_ICON[e.tier] ?? "🥚"}</span>
            <span class="egg-grade">${TIER_LABELS[e.tier] ?? e.tier} 알 <span class="tier-badge ${e.tier}" style="font-size:9px;padding:1px 6px;">${GRADE_HINT[e.tier] ?? e.tier}</span></span>
            <button class="buy-btn" data-kind="egg" data-tier="${e.tier}" ${e.canBuy ? "" : "disabled"}>${e.price.toLocaleString()} 구매</button>
          </div>`);
      });

      shopList.innerHTML = rows.join("");
    }

    // 되돌릴 수 없는 소비 행동이라 네이티브 confirm() 없이 버튼 자체 상태로 2단계
    // 확인(첫 클릭 → 라벨이 "정말 구매?"로 바뀜 → 두 번째 클릭에서 실제 구매).
    // 3초 안에 다시 안 누르면 원래 라벨로 자동 복귀.
    shopList.addEventListener("click", (ev) => {
      const btn = ev.target.closest(".buy-btn");
      if (!btn) return;

      if (btn.dataset.confirming !== "1") {
        btn.dataset.confirming = "1";
        btn.dataset.originalLabel = btn.textContent;
        btn.textContent = "정말 구매? (다시 클릭)";
        clearTimeout(btn._confirmTimer);
        btn._confirmTimer = setTimeout(() => {
          btn.dataset.confirming = "0";
          btn.textContent = btn.dataset.originalLabel;
        }, 3000);
        return;
      }

      clearTimeout(btn._confirmTimer);
      btn.disabled = true;
      btn.textContent = "구매 중...";
      const kind = btn.dataset.kind;
      const action =
        kind === "rareCandy" ? window.api.buyRareCandy()
        : kind === "shinyCharm" ? window.api.buyShinyCharm()
        : window.api.buyEgg(btn.dataset.tier);

      action.then((result) => {
        if (result.status) render(result.status);
        if (result.shop) renderShop(result.shop);
        else window.api.getShop().then(renderShop);
      });
    });

    document.getElementById("shopLink").addEventListener("click", () => {
      companionSubview.hidden = true;
      shopSubview.hidden = false;
      window.api.getShop().then(renderShop);
    });
    document.getElementById("shopBackBtn").addEventListener("click", () => {
      shopSubview.hidden = true;
      companionSubview.hidden = false;
    });

    // --- 가방 보기 ---
    const bagSubview = document.getElementById("bag-subview");
    const bagList = document.getElementById("bagList");

    function renderBag(bag) {
      if (bag.rareCandyCount <= 0) {
        bagList.innerHTML = `<div class="pokedex-empty">가진 아이템이 없어요.<br />상점에서 이상한 사탕을 사보세요.</div>`;
        return;
      }
      bagList.innerHTML = `
        <div class="egg-row">
          <span class="egg-icon">${ITEM_ICON.rareCandy}</span>
          <span class="egg-grade">이상한 사탕 <span class="dex-count">${bag.rareCandyCount}개</span></span>
          <button class="use-candy-btn" ${bag.canUseRareCandy ? "" : "disabled"}>사용</button>
        </div>`;
    }

    bagList.addEventListener("click", (ev) => {
      const btn = ev.target.closest(".use-candy-btn");
      if (!btn) return;
      btn.disabled = true;
      btn.textContent = "사용 중...";
      window.api.useRareCandy().then((result) => {
        if (result.status) render(result.status);
        if (result.bag) renderBag(result.bag);
      });
    });

    document.getElementById("bagLink").addEventListener("click", () => {
      companionSubview.hidden = true;
      bagSubview.hidden = false;
      window.api.getBag().then(renderBag);
    });
    document.getElementById("bagBackBtn").addEventListener("click", () => {
      bagSubview.hidden = true;
      companionSubview.hidden = false;
    });

    // 위젯 우클릭 메뉴 "⚙️ 설정"에서 옴 — 팝업이 방금 새로 열렸든(컴패니언 뷰가
    // 기본으로 보이는 상태) 이미 다른 서브뷰가 열려 있었든 상관없이 확실히 설정
    // 화면으로 전환한다.
    window.api.onShowView((view) => {
      if (view !== "settings") return;
      companionSubview.hidden = true;
      pokedexSubview.hidden = true;
      storageSubview.hidden = true;
      eggBoxSubview.hidden = true;
      shopSubview.hidden = true;
      bagSubview.hidden = true;
      settingsSubview.hidden = false;
      window.api.getSettings().then(renderSettings);
    });
  </script>
</body>
</html>
